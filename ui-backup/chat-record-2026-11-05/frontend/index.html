<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LegalGPT · Indian Penal Code assistant</title>
    <meta name="description" content="Answers questions about the Indian Penal Code from the statute text, with a source for every claim, fact checks and verifiable proofs. Legal information, not legal advice." />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0b0c" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- falls back to the system font when offline -->
    <link href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=Noto+Serif+Devanagari:wght@400..600&family=Noto+Sans+Devanagari:wght@400..600&display=swap" rel="stylesheet" />
    <script>
      // apply the saved theme before the first paint (src/theme.js manages it afterwards)
      try {
        var t = localStorage.getItem('legalgpt.theme')
        var dark = t === 'dark' || (t !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        var d = localStorage.getItem('legalgpt.darkStyle')
        document.documentElement.dataset.dark = d === 'midnight' || d === 'graphite' ? d : 'warm'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
