# Unit + stubbed end-to-end tests and the frontend build. No secrets: tests marked `integration`
# (live Groq / real index) are deselected, and every LLM in the remaining tests is a stub.
name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: SWI-Prolog (Module 5 rule engine)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends swi-prolog-nox
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -m "not integration" -q

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
